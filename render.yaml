services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: ghcr.io/n8n-io/n8n:latest-alpine
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
