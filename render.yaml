services:
  - type: web
    plan: free
    runtime: node
    name: n8n-service
    buildCommand: NODE_OPTIONS="--max-old-space-size=400" npm install --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 10000
      - key: N8N_PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: sqlite
