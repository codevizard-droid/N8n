services:
  - type: web
    plan: free
    runtime: node
    name: n8n-service
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
